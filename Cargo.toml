[package]
name = "music-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
tower = "0.5.2"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
uuid = { version = "1.26.0", features = ["v4"] }
