<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track — plainsong</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:," />
    <script>
      // Applied before the first paint so a remembered light theme does not flash
      // dark; the switch itself lives in theme.js, which reads the same key.
      try {
        if (localStorage.getItem("plainsong-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">plain<span>song</span></div>
        <div class="header-right">
          <a href="/" data-i18n="backToAll"></a>
          <button type="button" class="theme" id="theme"></button>
          <div class="lang" id="lang" role="group" aria-label="Language / Język">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="pl">PL</button>
          </div>
        </div>
      </header>

      <p class="notice" id="notice" hidden role="status"></p>

      <div class="detail" id="detail"></div>
    </div>

    <script type="module" src="/track.js"></script>
  </body>
</html>
