<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plainsong</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:," />
    <script>
      // Applied before the first paint so a remembered light theme does not flash
      // dark; the switch itself lives in theme.js, which reads the same key.
      try {
        if (localStorage.getItem("plainsong-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand-block">
          <div class="brand">plain<span>song</span></div>
          <span class="track-count" id="track-count" role="status"></span>
        </div>
        <div class="header-right">
          <input
            id="search"
            type="search"
            autocomplete="off"
            data-i18n-placeholder="searchPlaceholder"
            data-i18n-label="searchLabel"
          />
          <button type="button" class="theme" id="theme"></button>
          <div class="lang" id="lang" role="group" aria-label="Language / Język">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="pl">PL</button>
          </div>
          <button
            type="button"
            class="menu"
            id="menu"
            aria-haspopup="dialog"
            aria-expanded="false"
            data-i18n-label="menu"
          ></button>
        </div>
      </header>

      <nav class="nav" data-i18n-label="navLabel">
        <a href="/" aria-current="page" data-i18n="navTracks"></a>
        <a href="/playlists.html" data-i18n="navPlaylists"></a>
        <div class="nav-actions">
          <button type="button" class="icon" id="add-track"></button>
          <button type="button" class="icon" id="token-button"></button>
          <button type="button" class="icon" id="new-playlist"></button>
        </div>
      </nav>

      <p class="notice" id="notice" hidden role="status"></p>

      <div id="list-container"></div>
    </div>

    <div class="player-bar" id="player-bar" hidden>
      <div class="wrap player-bar-inner">
        <span class="player-bar-title" id="player-bar-title"></span>
        <div class="player-bar-track">
          <div class="player-bar-fill" id="player-bar-fill"></div>
        </div>
        <span class="player-bar-time" id="player-bar-time"></span>
      </div>
    </div>

    <audio id="player" preload="none"></audio>
    <script type="module" src="/app.js"></script>
  </body>
</html>
