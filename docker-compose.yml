services:
  plainsong:
    build: .
    image: plainsong
    container_name: plainsong
    # Published on the loopback interface only; drop the `127.0.0.1:` prefix to expose
    # the port on the whole network, or leave it and put a reverse proxy in front.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PLAINSONG_TOKEN: ${PLAINSONG_TOKEN:?set PLAINSONG_TOKEN in .env}
      PLAINSONG_MAX_UPLOAD_MB: ${PLAINSONG_MAX_UPLOAD_MB:-100}
    volumes:
      - plainsong-data:/data
    restart: unless-stopped

volumes:
  plainsong-data:
